spring.application.name=security-lens
server.port=${PORT:8081}

spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

logging.level.root=INFO
logging.level.com.nocklock.securitylens=DEBUG

security-lens.ocr.datapath=tessdata
security-lens.ocr.language=kor+eng
security-lens.ocr.dpi=300
security-lens.ocr.page-seg-mode=3
security-lens.ocr.scale-factor=2

security-lens.ai.base-url=https://api.openai.com
security-lens.ai.model=gpt-5.6-terra
security-lens.ai.vision-model=gpt-5.6-terra
security-lens.ai.api-key=${OPENAI_API_KEY}