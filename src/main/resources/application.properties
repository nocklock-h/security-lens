spring.application.name=security-lens
server.port=8081

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

logging.level.root=INFO
logging.level.com.nocklock.securitylens=DEBUG

security-lens.ocr.datapath=tessdata
security-lens.ocr.language=kor+eng
security-lens.ocr.dpi=300
security-lens.ocr.page-seg-mode=11
security-lens.ocr.scale-factor=2
security-lens.ai.base-url=http://localhost:11434
security-lens.ai.model=gemma3:4b